<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Quản Trị (Admin)</title>
  <script>
    // Tự động kiểm tra: Chưa đăng nhập sẽ bị đẩy về index.html
    if (sessionStorage.getItem("isAdmin") !== "true") {
      alert("Bạn chưa đăng nhập!");
      window.location.href = "index.html";
    }
  </script>
  <style>
    body { background-color: #0f172a; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 8px; }
    .logout-btn { padding: 8px 16px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="admin-header">
    <h2>⚙️ BẢNG QUẢN TRỊ ADMIN</h2>
    <button class="logout-btn" onclick="logout()">Đăng xuất</button>
  </div>

  <div style="margin-top: 30px;">
    <h3>Chào mừng Admin!</h3>
    <p>Đây là giao diện quản trị dành riêng cho bạn.</p>
  </div>

  <script>
    function logout() {
      sessionStorage.removeItem("isAdmin");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
